<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전국 시도교육청 링크</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e5e5e5;
    --hover: #f5f5f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --border: #2e2f31;
      --hover: #232427;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }
  p.desc {
    color: var(--muted);
    margin: 0 0 32px;
    font-size: 0.9rem;
  }
  h2 {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 32px 0 8px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--border);
  }
  li {
    border-bottom: 1px solid var(--border);
  }
  a {
    display: block;
    padding: 12px 4px;
    color: var(--fg);
    text-decoration: none;
  }
  a:hover {
    background: var(--hover);
  }
  footer {
    margin-top: 40px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>전국 시도교육청</h1>
  <p class="desc">17개 시·도교육청 홈페이지 바로가기</p>

  <h2>특별시 · 광역시</h2>
  <ul>
    <li><a href="https://www.sen.go.kr/" target="_blank" rel="noopener">서울특별시교육청</a></li>
    <li><a href="https://www.pen.go.kr/" target="_blank" rel="noopener">부산광역시교육청</a></li>
    <li><a href="https://www.dge.go.kr/" target="_blank" rel="noopener">대구광역시교육청</a></li>
    <li><a href="https://www.ice.go.kr/" target="_blank" rel="noopener">인천광역시교육청</a></li>
    <li><a href="https://www.gen.go.kr/" target="_blank" rel="noopener">광주광역시교육청</a></li>
    <li><a href="https://www.dje.go.kr/" target="_blank" rel="noopener">대전광역시교육청</a></li>
    <li><a href="https://www.use.go.kr/" target="_blank" rel="noopener">울산광역시교육청</a></li>
    <li><a href="https://www.sje.go.kr/" target="_blank" rel="noopener">세종특별자치시교육청</a></li>
  </ul>

  <h2>도</h2>
  <ul>
    <li><a href="https://www.goe.go.kr/" target="_blank" rel="noopener">경기도교육청</a></li>
    <li><a href="https://www.gwe.go.kr/" target="_blank" rel="noopener">강원특별자치도교육청</a></li>
    <li><a href="https://www.cbe.go.kr/" target="_blank" rel="noopener">충청북도교육청</a></li>
    <li><a href="https://www.cne.go.kr/" target="_blank" rel="noopener">충청남도교육청</a></li>
    <li><a href="https://www.jbe.go.kr/" target="_blank" rel="noopener">전북특별자치도교육청</a></li>
    <li><a href="https://www.jne.go.kr/" target="_blank" rel="noopener">전라남도교육청</a></li>
    <li><a href="https://www.gbe.kr/" target="_blank" rel="noopener">경상북도교육청</a></li>
    <li><a href="https://www.gne.go.kr/" target="_blank" rel="noopener">경상남도교육청</a></li>
    <li><a href="https://www.jje.go.kr/" target="_blank" rel="noopener">제주특별자치도교육청</a></li>
  </ul>

  <footer>출처: 교육부</footer>
</main>
</body>
</html>
